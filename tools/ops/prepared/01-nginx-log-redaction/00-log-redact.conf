# PREPARED, NOT RUN: needs the owner's approval. Install as /etc/nginx/conf.d/00-log-redact.conf (nginx.conf line 60 includes conf.d/*.conf).
#
# Purpose: the default "combined" access log writes $request (the full request line with the query string) and $http_referer (which can carry a query
# string). A preview URL such as /api/assistant/preview?key=... therefore leaves the key in the log. This format writes the path only ($uri, no query)
# and the Referer without its query or fragment.
#
# nginx resolves log_format names when it merges the configuration, so defining it here (included after the access_log line at nginx.conf:41) is fine;
# `nginx -t` proves it before any reload. Untested on a real nginx: it has not been run anywhere.

map $http_referer $referer_noquery {
    default "-";
    "~^(?<refbase>[^?#]*)" $refbase;
}

log_format redacted '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$referer_noquery" "$http_user_agent"';
