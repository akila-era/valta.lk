name: valta

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: valta_web
      POSTGRES_USER: valta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valta -d valta_web"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      args:
        ERP_IMAGE_HOSTS: ${ERP_IMAGE_HOSTS:-}
        HX_API_BASE: ${HX_API_BASE:-}
    image: valta/web:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://valta:${POSTGRES_PASSWORD}@db:5432/valta_web
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8090}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # Calls the order-sync endpoint every minute (see docs/ENVIRONMENT.md, ORDER_SYNC_SECRET).
  # Off by default; start it with `docker compose --profile erp up -d` once the ERP is configured.
  order-sync:
    profiles: ["erp"]
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    env_file: .env
    depends_on:
      - web
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'while true; do sleep 60; curl -fsS -o /dev/null -X POST -H "Authorization: Bearer $$ORDER_SYNC_SECRET" http://web:3000/api/internal/sync-orders || echo "order sync failed"; done'

  # DEMO ONLY: the mock HEXALYTE ERP from apps/web/tests (15 fake products, orders kept in memory and lost on restart).
  # Start it with `docker compose --profile demo up -d` and point the site at it in .env:
  #   HX_API_BASE=http://mock-erp:4010/api/v1/store-api   HX_STORE_CREDENTIAL=hxs_test.testsecret
  # It has no published port: its /__control test endpoint must never be reachable from the internet.
  # Remove the profile and set the real ERP values to end the demo (see docs/DEPLOYMENT.md).
  mock-erp:
    profiles: ["demo"]
    image: valta/web:latest
    restart: unless-stopped
    working_dir: /app/apps/web
    environment:
      MOCK_ERP_PORT: "4010"
    command: ["npx", "tsx", "tests/mock-erp/server.ts"]
    expose:
      - "4010"

volumes:
  db-data:
