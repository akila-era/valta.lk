name: valta

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: valta_web
      POSTGRES_USER: valta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valta -d valta_web"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Private S3-compatible image storage. Not published on any host port: only the web container can reach it, and the
  # browser only ever sees /api/media/... URLs served by the web app. Pinned to the last community release with the
  # stock Docker Hub image; swap for any S3-compatible server by changing S3_ENDPOINT and the keys.
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in .env}
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      args:
        ERP_IMAGE_HOSTS: ${ERP_IMAGE_HOSTS:-}
        HX_API_BASE: ${HX_API_BASE:-}
    image: valta/web:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://valta:${POSTGRES_PASSWORD}@db:5432/valta_web
      S3_ENDPOINT: http://storage:9000
      S3_BUCKET: ${STORAGE_BUCKET:-valta-media}
      S3_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      S3_SECRET_KEY: ${STORAGE_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8090}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # Calls the order-sync endpoint every minute (see docs/ENVIRONMENT.md, ORDER_SYNC_SECRET).
  # Off by default; start it with `docker compose --profile erp up -d` once the ERP is configured.
  order-sync:
    profiles: ["erp"]
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    env_file: .env
    depends_on:
      - web
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'while true; do sleep 60; curl -fsS -o /dev/null -X POST -H "Authorization: Bearer $$ORDER_SYNC_SECRET" http://web:3000/api/internal/sync-orders || echo "order sync failed"; done'

volumes:
  db-data:
  storage-data:
